name: keepalive
on:
  schedule:
    - cron: "0 12 5 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit so scheduled workflows are not paused
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "Monthly keepalive"
          git push
